<main class="page">
  <h1>Send a message</h1>

  <form class="message-form" [formGroup]="form" (ngSubmit)="submit()">
    <label class="visually-hidden" for="message">Message</label>
    <input
      id="message"
      type="text"
      formControlName="message"
      placeholder="Type a message"
      autocomplete="off"
    />
    <button type="submit" [disabled]="sending()">{{ sending() ? 'Sending…' : 'Send' }}</button>
  </form>

  <section class="responses" role="log" aria-label="API responses">
    @for (response of responses(); track $index) {
      <p class="response" [class.error]="response.isError">{{ response.text }}</p>
    } @empty {
      <p class="placeholder">Responses will appear here.</p>
    }
  </section>
</main>
